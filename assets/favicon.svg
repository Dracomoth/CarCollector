  <path d="M10 39 C12 37, 16 36, 20 36 C24 36, 26 39, 29 39 L37 39 C40 39, 42 36, 46 36 C50 36, 53 37, 55 39 C56 39, 57 38, 57 37 C57 35, 54 33, 50 32 L44 32 C42 27, 38 23, 31 23 L22 23 C18 23, 14 26, 12 30 L8 34 C6 36, 6 38, 7 39 Z" fill="url(#carGrad)"/>
  
